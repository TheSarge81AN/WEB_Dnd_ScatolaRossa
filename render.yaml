services:
  - type: web
    name: dnd-scatola-rossa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m compileall -q dnd_web.py dnd_fork.py web_auth.py
    startCommand: python dnd_web.py
    healthCheckPath: /health
    envVars:
      - key: WEB_USERNAME
        value: dungeon-master
      - key: DnD_USER_PASSWORD
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
